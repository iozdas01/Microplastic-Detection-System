# ⚠ THIS FILE IS PROBABLY NOT THE ONE RUNNING. VERIFY BEFORE EDITING. ⚠
#
# The `startup-firecrawl` compose project is shared across sibling repos, and
# whichever repo started the stack owns the bind mount. Check with:
#
#   docker inspect startup-firecrawl-searxng-1 \
#     --format '{{range .Mounts}}{{.Source}}{{println}}{{end}}' | grep searxng
#
# On 2026-09-02 that pointed at "Startup Ideation/infra/firecrawl/", meaning
# every edit made here since — including the 2026-08-17 re-enable below — was a
# no-op. That mis-lead cost a full ideation run: the 2026-08-31 shotgun recorded
# "google and duckduckgo returned no results" when in truth they were disabled
# in the live file and never ran at all. Edit the MOUNTED file, then restart.

use_default_settings: true

general:
  debug: false
  instance_name: Startup Ideation Search

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: 0.0.0.0
  secret_key: startup-ideation-local-only
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  pool_connections: 50
  pool_maxsize: 10

# Engine selection, set 2026-08-17 after every default general engine failed.
#
# Diagnosis: the container's egress is healthy — DNS resolves and example.com
# and bing.com both answer from inside it. The failure was engine-side:
#
#   google cse  → "Our systems have detected unusual traffic from your network"
#                 (repeated 180s suspensions; the exit IP is flagged)
#   duckduckgo  → ConnectTimeout to html.duckduckgo.com, 15s
#
# SUPERSEDED 2026-09-02. Re-measured against the actually-mounted file:
#   google cse  → WORKING, and the only engine returning on-topic results.
#                 44 records over 9 sequential calls, zero empties. It is now
#                 the primary discovery engine.
#   duckduckgo  → CAPTCHA        startpage → Suspended: CAPTCHA
#   brave       → Suspended      mojeek/qwant → access denied / CAPTCHA
#   bing        → answers, but ignores site: and returns dictionary pages
#   `google`    → not a valid engine name in searxng 2026.7.26; only
#                 `google cse` exists. Listing it is silently ignored.
#
# With both of those dead the default profile returned Wikipedia and nothing
# else, so `site:reddit.com ...` searches came back genuinely empty and
# Firecrawl correctly reported "No search results found".
#
# Anything disabled here is disabled because it was observed failing from this
# network, not because it is a bad engine. Re-enable and re-test after a network
# or exit-IP change.
engines:
  # ── Verified 2026-09-02 against the mounted file. ────────────────────────
  - name: google cse
    disabled: false     # PRIMARY. The only engine returning on-topic results.
  - name: duckduckgo
    disabled: false     # CAPTCHA as of 2026-09-02; harmless to leave enabled.
  - name: startpage
    disabled: false     # Suspended: CAPTCHA as of 2026-09-02.

  # ── Verified reachable from inside the container ──────────────────────────
  - name: bing
    disabled: false

  # ── Independent crawlers: no shared upstream with Google, so a Google-level
  #    IP flag does not take them down with it. ──────────────────────────────
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: marginalia
    disabled: false

  # ── Forum and discussion search. Enabled deliberately: this instance is used
  #    for customer-pain reconnaissance, where practitioner forum threads are
  #    the target and a general web engine is a blunt instrument. These also
  #    partly cover for Reddit's JSON API being blocked. ────────────────────
  - name: crowdview
    disabled: false
  - name: boardreader
    disabled: false
