# Idea lifecycle index — the ONE authored input to every reports/{slug}/BRIEF.md.
#
# This is an index, not state. It is cross-idea by nature (like methods/index.md and
# cases/index.md), and it is deliberately the ONLY thing here that a human writes about
# an idea's position: everything else in a BRIEF is derived from that idea's own files.
#
# ─── WHAT MUST NEVER GO IN ───────────────────────────────────────────────────
# No findings. No active hunch or assumption IDs. No evidence. No counts.
#
# That restriction is the whole point, and it is load-bearing. The file this replaces
# (per-idea STATUS.md) carried the active hunch alongside the lifecycle, and on
# 2026-08-06 it said "active — H004" for a day after H004 had been folded into an
# offering, while hunch-lineage.md correctly said H003. Two authors, one fact, one of
# them wrong. Keeping the hunch out of this file means that contradiction cannot be
# written down again — the hunch has exactly one author, `hunch-lineage.md` frontmatter,
# and BRIEF.md reads it from there.
#
# `lifecycle` values: vocab:idea_lifecycle in schemas/vocabularies.yaml.
# `note` is one line of orientation for a human scanning the list — why this idea is
# where it is, never what it concluded.
#
# After editing: python3 scripts/build_brief.py --all

version: 1

ideas:
  custom-kitchen-cabinets:
    lifecycle: active
    note: >-
      Seeded 2026-08-31 from the market-evidence pipeline now at scripts/research/, which measured its way
      from configurable furniture to fitted cabinetry. Belief and H1 are recorded, the
      assumption graph is built, and every node is untested — the ledger holds only desk
      measurement. Next step is the first trade outreach on the root pain assumption.
