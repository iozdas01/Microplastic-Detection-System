# What each page in this folder is, and whether it still holds.
#
# The control room's Pages tab is generated from this file. Titles are NOT listed here —
# they are read from each page's own <title>, so they cannot drift. This file authors only
# the two things a page does not state about itself: what it is for in one line, and whether
# it has been superseded by a later one.
#
# Adding a page: drop the .html in this folder and add a row. A page with no row still
# renders, flagged as unlisted — visible rather than silently missing.
#
# status: current | superseded | generated
#   current    — hand-authored, still the live version
#   superseded — kept for reference, a later page replaced it. Say which in `note`.
#   generated  — rebuilt by a script in scripts/research/; never hand-edit it

version: 1

pages:
  - file: sizing.html
    status: current
    group: evidence
    note: >-
      Bottom-up model for H1, built from one removal company upward rather than from a market
      report down. Every input is badged sourced / from-calls / guess, and the sensitivity
      panel ranks which unknown moves gross profit most - that ranking is the call list.

  - file: hmlv-map.html
    status: current
    group: evidence
    note: >-
      The whole-industry overview, built to choose a hunch from. ~30 companies across HMLV
      manufacturing - B2B and B2C, alive and dead - on two maps plus one full table. Map 1 is
      the live B2B market and each player's stated ceiling; Map 2 is the consumer side, where
      only surface personalisation and fitted-installed goods survive. Positions live here;
      causes of death live in predecessors.html.

  - file: predecessors.html
    status: current
    group: evidence
    note: >-
      The 2026-08-31 shotgun explore run made readable: every company found that tried to
      industrialise made-to-order production across 120 years - the dead AND the ones still
      running - what killed each, why the survivors survived, a positioning map of all of
      them, what happened to US furniture manufacturing, and where the wedge ranking landed.
      Read this before cabinet-plan.html - it contradicts parts of it.

  - file: cabinet-plan.html
    status: superseded
    group: plan
    note: >-
      The full build plan, and the most complete statement of the idea: why cabinets rather
      than furniture, the product, the process, where the 13.5 design hours go, the AI stack,
      the manufacturing plan, the numbers, the build order, and what is still unresolved.

  - file: build-board.html
    status: current
    group: plan
    note: >-
      What to do in what order, with costs and decision gates. The free things that could
      kill the idea come before the expensive things that assume it works. Tick state is
      saved in your browser only.

  - file: cabinet-plan-final.html
    status: superseded
    group: plan
    note: >-
      A trimmed presentation cut of cabinet-plan.html — same seven opening sections, without
      the numbers, build order or unresolved questions. Despite the filename, cabinet-plan.html
      is the fuller and more current document.

  - file: cabinet-demand-case.html
    status: generated
    group: evidence
    note: >-
      Is there demand for custom cabinets, and how every number behind that was derived.
      Rebuilt by scripts/research/build_cabinet_page.py.

  - file: us-configurable-furniture.html
    status: generated
    group: evidence
    note: >-
      The US market page for the configurable-furniture thesis this idea started from — TAM,
      the article scorecard, SAM and SOM. Rebuilt by scripts/research/build_page_us.py.

  - file: autonomous-factory-plan.html
    status: generated
    group: evidence
    note: >-
      The original autonomous-factory build proposal, with layout and flow diagrams. Rebuilt
      by scripts/research/build_plan_page.py.

  - file: business-plan.html
    status: superseded
    group: plan
    note: >-
      "The Unattended Cell" — the furniture-factory business plan written before the thesis
      moved to cabinets. Superseded by cabinet-plan.html; kept because the cell economics and
      the honest market section still apply.

  - file: bay-area-hardwood-demand.html
    status: superseded
    group: evidence
    note: >-
      The Bay Area dining-furniture demand page this project opened with, before the scope
      went national and then narrowed to cabinets. Superseded by us-configurable-furniture.html.
      Its markdown counterpart is in research/archive/.

  - file: inbound-demand-map.html
    status: generated
    group: evidence
    note: >-
      Where "make me this" demand actually arrives, across every machinable material — 43
      search terms anchored on one comparable scale, then discounted by how much of each term
      means something other than manufacturing. Answers the founder's question directly and
      contains the finding that the blocked-part lane H2 is testing has no inbound web demand
      at all. Rebuilt by scripts/research/build_demand_map_page.py.

  - file: market-ladder.html
    status: generated
    group: evidence
    note: >-
      The US window-coverings market as a ladder of business sizes, smallest firm to
      enterprise, with what a remake costs at each rung. Carries the finding that ten
      manufacturers hold 62.5% of the industry while the bottom of the ladder cannot afford
      anything, and that a blinds-only software business tops out near $9m ARR. Rebuilt by
      scripts/research/build_market_ladder_page.py.

  - file: call-log.html
    status: current
    group: outreach
    note: >-
      Notes template for a discovery call — open it while you are on the phone. Saves to your
      browser only; the durable record goes to outreach/contacts.md and the evidence ledger.

  - file: outreach-send-sheet.html
    status: generated
    group: outreach
    note: >-
      The researcher email campaign as a working surface — every draft with its subject and
      body copyable in one click, in send order, with the timezone and one-address-per-org
      rules attached. Sent-state is browser-local; the campaign's real record is
      outreach/email/researchers-2026-09/targets.csv. Rebuilt by
      scripts/research/build_send_sheet.py.

  - file: window-covering-market.html
    status: generated
    group: evidence
    note: >-
      The H3 market on one page, built to decide where to enter rather than to run outreach.
      Three Census layers with their establishment size distributions, the five founder calls,
      every number badged measured / from-a-call / unsourced / unknown, the one missing
      multiplier, and five entry options ranked by what the evidence supports. Carries a
      standing correction: NAICS 442291 counts specialist stores only, so Home Depot, Lowe's,
      e-commerce and the franchise networks are invisible in it and no single code contains
      this trade. Rebuilt by scripts/research/build_market_entry_page.py.

  - file: window-covering-players.html
    status: generated
    group: evidence
    note: >-
      The market as seven layers, each with its own cost structure for the same failure, its
      own sizing formula, its own missing number and its own person to phone. Ranks the calls
      by leverage rather than by layer order: a franchisor aggregates remake data across ~1,000
      businesses, and an online retailer's rate is the only one uncontaminated by a
      professional measuring visit. Carries the worked example for layer 1 off the measured
      $225 visit. Rebuilt by scripts/research/build_players_page.py.
