# What each page in this folder is, and whether it still holds.
#
# The control room's Pages tab is generated from this file. Titles are NOT listed here —
# they are read from each page's own <title>, so they cannot drift. This file authors only
# the two things a page does not state about itself: what it is for in one line, and whether
# it has been superseded by a later one.
#
# Adding a page: drop the .html in this folder and add a row. A page with no row still
# renders, flagged as unlisted — visible rather than silently missing.
#
# status: current | superseded | generated
#   current    — hand-authored, still the live version
#   superseded — kept for reference, a later page replaced it. Say which in `note`.
#   generated  — rebuilt by a script in scripts/research/; never hand-edit it

version: 1

pages:
  - file: capability-matrix.html
    status: generated
    group: evidence
    note: >-
      Every software company selling into the window-covering trade scored on the ten jobs
      between a customer wanting a blind and a machine cutting one, ordered by revenue.
      Carries the finding the page exists for: the middle of the pipeline - quoting, orders,
      deductions to cut list, file out to the cutting table - is occupied by incumbents up to
      forty-three years old, while both ends are empty. Nobody captures a measurement without
      a person on site, and nobody routes a job across shops or reads a machine back. Rebuilt
      by scripts/research/build_capability_matrix_page.py.

  - file: system-architecture.html
    status: current
    group: plan
    note: >-
      How the product is actually built: two subsystems joined only by the Order schema, the
      six data objects with their real fields, five transforms of which four are pure, and the
      three agents - all of which run at setup, never in the request path. Carries the machine
      inventory for a blind fabricator's floor with each machine's control type and what it
      will accept today, and the finding that the only MHS-ready machine there is the shutter
      router. Proposed design, not built.

  - file: hmlv-map.html
    status: current
    group: evidence
    note: >-
      The whole-industry overview, built to choose a hunch from. ~30 companies across HMLV
      manufacturing - B2B and B2C, alive and dead - on two maps plus one full table. Map 1 is
      the live B2B market and each player's stated ceiling; Map 2 is the consumer side, where
      only surface personalisation and fitted-installed goods survive. Positions live here;
      causes of death live in predecessors.html.

  - file: predecessors.html
    status: current
    group: evidence
    note: >-
      The 2026-08-31 shotgun explore run made readable: every company found that tried to
      industrialise made-to-order production across 120 years - the dead AND the ones still
      running - what killed each, why the survivors survived, a positioning map of all of
      them, what happened to US furniture manufacturing, and where the wedge ranking landed.

  - file: market-ladder.html
    status: generated
    group: evidence
    note: >-
      The US window-coverings market as a ladder of business sizes, smallest firm to
      enterprise, with what a remake costs at each rung. Carries the finding that ten
      manufacturers hold 62.5% of the industry while the bottom of the ladder cannot afford
      anything, and that a blinds-only software business tops out near $9m ARR. Rebuilt by
      scripts/research/build_market_ladder_page.py.

  - file: call-log.html
    status: superseded
    group: outreach
    note: >-
      Retired 2026-09-04 at the founder's call. It was a blank notes template to open while on
      the phone, not a record — it never held a company. Nothing replaces its note-taking
      function; field-map.html took its place in this list by holding the companies the founder
      believed were in here.

  - file: field-map.html
    status: generated
    group: outreach
    note: >-
      The five window-covering companies behind the H3 evidence, placed on a schematic San
      Francisco map and banded by which of the seven trade layers each sits on. Carries the
      finding that the three with a street address are a 1934 independent, a designer's
      workroom and a national's appointment-only suite — three different layers within four
      miles. Also renders the two that cannot be placed, including the unidentified retailer
      that is the sole source of the $225 visit. Generated from outreach/companies.md by
      scripts/research/build_field_map_page.py.

  - file: outreach-send-sheet.html
    status: generated
    group: outreach
    note: >-
      The researcher email campaign as a working surface — every draft with its subject and
      body copyable in one click, in send order, with the timezone and one-address-per-org
      rules attached. Sent-state is browser-local; the campaign's real record is
      outreach/email/researchers-2026-09/targets.csv. Rebuilt by
      scripts/research/build_send_sheet.py.

  - file: window-covering-market.html
    status: generated
    group: evidence
    note: >-
      The H3 market on one page, built to decide where to enter rather than to run outreach.
      Three Census layers with their establishment size distributions, the five founder calls,
      every number badged measured / from-a-call / unsourced / unknown, the one missing
      multiplier, and five entry options ranked by what the evidence supports. Carries a
      standing correction: NAICS 442291 counts specialist stores only, so Home Depot, Lowe's,
      e-commerce and the franchise networks are invisible in it and no single code contains
      this trade. Rebuilt by scripts/research/build_market_entry_page.py.

  - file: window-covering-players.html
    status: generated
    group: evidence
    note: >-
      The commercial map of the trade. Seven layers, each with its own cost structure for the
      same failure, its own sizing formula, its own missing number and its own person to phone
      — now also with the measured revenue behind each layer where a NAICS code exists, and
      the companies actually spoken to placed on it. Leads with the shape of the market: 73%
      of the $9.63bn US retail line sits in layers no industry code counts, which is why this
      page sizes bottom-up. Ranks calls by leverage, not layer order. Rebuilt by
      scripts/research/build_players_page.py.

  - file: startup-map.html
    status: generated
    group: evidence
    note: >-
      The startup scene, arranged by how much risk each company takes on the outcome rather
      than by sector, because that is the axis the belief turns on. Quiet at rest — name,
      stage, raise, one line — with everything else on click. Two lanes render empty, which is
      the finding: there is no middle ground between selling a licence and owning the part.
      Continues the map begun under manufacturing-execution-layer; carries a standing note
      that no window-covering company is on it yet. Rebuilt by
      scripts/research/build_startup_map_page.py.

  - file: pitch-slide.html
    status: generated
    group: outreach
    note: >-
      The pitch as the single slide EF Form SCI asks for — one-liner, problem, solution, team,
      market, plus what we do not know yet, which the brief explicitly asks to see rather than
      have papered over. Every claim is badged by where it comes from: a call or a measurement,
      a public source, a fact about the founder, or an untested claim of ours. Cmd-P gives one
      landscape page to upload. Authored in the `slide:` block of
      outreach/copy/H3-discovery-pitch.md; rebuilt by
      scripts/research/build_pitch_slide_page.py.

  - file: progress-log.html
    status: generated
    group: evidence
    note: >-
      What the founder was trying to find out on each working day, newest first, with each
      day's Truth line flagged against the day before it. The diff on that one line is the
      point: a question that changed with evidence behind it reads differently from one that
      changed because the old one got boring, and from one that has not moved in a week.
      Authored in progress-log.md by /startup-daily-log; rebuilt by
      scripts/research/build_progress_log_page.py.
